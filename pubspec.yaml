name: flappy_translator
description: A tool which automatically generates Flutter localization resources from CSV and Excel files.
version: 2.1.0
homepage: https://github.com/smartnsoft/FlappyTranslator
repository: https://github.com/smartnsoft/FlappyTranslator
issue_tracker: https://github.com/smartnsoft/FlappyTranslator/issues
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  arb_generator: # 0.0.4
    # path: ../arb_generator
    git:
      url: https://github.com/infradise/arb_generator.git
      ref: visualkube

  yaml: 3.1.3
  dart_style: 3.1.2 # 3.1.2 (requires analyzer ^8.0.0), 3.1.1 (analyzer 7.6.0)
  excel: # 4.0.6
    # path: ../excel
    git:
      url: https://github.com/infradise/excel.git
      ref: visualkube

dev_dependencies:
  test: 1.26.3
  lints: 6.0.0
